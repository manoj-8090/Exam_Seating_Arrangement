<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | College Examination Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-400: #94a3b8;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      background-image: 
        radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.25) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.2) 0px, transparent 50%);
      padding: 20px;
    }

    .back-home-btn {
      position: absolute;
      top: 25px;
      left: 25px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      color: var(--slate-300);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .back-home-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      color: var(--white);
      transform: translateY(-1px);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--white);
      border-radius: 24px;
      padding: 40px 35px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: floatUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes floatUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      color: var(--white);
      box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
    }

    .login-header h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--slate-900);
      letter-spacing: -0.5px;
    }

    .login-header p {
      font-size: 14px;
      color: var(--slate-500);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--slate-700);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1.5px solid var(--slate-200);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--slate-800);
      outline: none;
      transition: all 0.2s;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      color: var(--white);
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #4338ca, #3730a3);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.45);
    }

    .error-alert {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .credentials-hint {
      margin-top: 25px;
      background: var(--slate-50);
      border: 1px solid var(--slate-200);
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      color: var(--slate-600);
      text-align: center;
    }

    .credentials-hint code {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--primary);
      background: #eef2ff;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-home-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Return to Portal
  </a>

  <div class="login-container">
    <div class="login-header">
      <div class="header-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1>Superintendent Login</h1>
      <p>Secure administrative access to scheduling & seat allocation</p>
    </div>

    <div id="errorBox" class="error-alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Administrator Username</label>
        <input type="text" id="username" class="form-input" value="admin" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-input" value="admin123" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-submit">Authenticate & Enter Dashboard</button>
    </form>

    <div class="credentials-hint">
      Default Access: User: <code>admin</code> &bull; Pass: <code>admin123</code>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if (isLoggedIn()) {
      window.location.href = 'admin.html';
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const err = document.getElementById('errorBox');

      if (login(u, p)) {
        window.location.href = 'admin.html';
      } else {
        err.textContent = 'Invalid administrator credentials. Please check username and password.';
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
