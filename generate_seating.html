<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examination Seating Arrangement & Door Notice</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      padding: 30px 15px;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 20px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .header-bar h1 {
      margin: 0;
      font-size: 22px;
      text-transform: uppercase;
      color: #0f172a;
      letter-spacing: 0.5px;
    }

    .nav-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #0052cc;
      color: white;
    }

    .btn-primary:hover {
      background: #003e99;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .meta-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .meta-item span {
      font-size: 12px;
      color: #64748b;
      text-transform: uppercase;
      display: block;
      font-weight: 600;
    }

    .meta-item strong {
      font-size: 16px;
      color: #0f172a;
    }

    /* Room Plan Card */
    .room-notice {
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      margin-bottom: 30px;
      overflow: hidden;
      page-break-after: always;
    }

    .room-notice-header {
      background: #0f172a;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .room-notice-header h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.5px;
    }

    .room-notice-header span {
      font-size: 13px;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 12px;
    }

    .columns-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .column-half {
      padding: 20px;
    }

    .column-half:first-child {
      border-right: 1px dashed #cbd5e1;
      background: #fafbfc;
    }

    .column-half:last-child {
      background: #fff;
    }

    .col-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
    }

    .left-col-title { color: #0052cc; border-color: #0052cc; }
    .right-col-title { color: #00a389; border-color: #00a389; }

    .detail-row {
      margin-bottom: 8px;
      font-size: 14px;
    }

    .detail-row label {
      color: #64748b;
      font-weight: 600;
      display: inline-block;
      width: 110px;
    }

    .roll-grid {
      margin-top: 15px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      max-height: 200px;
      overflow-y: auto;
    }

    .roll-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .roll-tag {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      font-weight: 600;
    }

    @media print {
      body { background: white; padding: 0; }
      .container { box-shadow: none; border-radius: 0; max-width: 100%; padding: 0; }
      .header-bar .nav-actions { display: none !important; }
      .room-notice { border: 1px solid #000; margin-bottom: 40px; page-break-after: always; }
      .room-notice-header { background: #333 !important; color: white !important; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <div>
        <h1>Examination Hall Seating Arrangement</h1>
        <div style="font-size: 13px; color: #64748b; margin-top: 3px;">Official Invigilator & Door Notice Display</div>
      </div>
      <div class="nav-actions">
        <button onclick="window.print()" class="btn btn-primary">&#128438; Print Door Charts</button>
        <a href="admin.html" class="btn btn-secondary">&larr; Back to Admin</a>
      </div>
    </div>

    <div class="meta-card">
      <div class="meta-item">
        <span>Exam Date</span>
        <strong id="planDateText">-</strong>
      </div>
      <div class="meta-item">
        <span>Exam Session</span>
        <strong id="planSessionText">-</strong>
      </div>
      <div class="meta-item">
        <span>Total Students Seated</span>
        <strong id="planTotalText">-</strong>
      </div>
      <div class="meta-item">
        <span>Halls Configured</span>
        <strong id="planRoomsText">-</strong>
      </div>
    </div>

    <div id="noticeContainer"></div>
  </div>

  <script src="app.js"></script>
  <script>
    // Get active plan or generate for default date
    const plans = getAllSeatingPlans();
    let plan = null;
    const activeKey = localStorage.getItem('cs_active_plan');

    if (activeKey && plans[activeKey]) {
      plan = plans[activeKey];
    } else {
      const keys = Object.keys(plans);
      if (keys.length > 0) {
        plan = plans[keys[keys.length - 1]];
      } else {
        plan = generateSeatingForDate('2026-10-15', 'Morning (09:30 AM - 12:30 PM)', ['all']);
      }
    }

    if (plan && plan.room_allocations) {
      document.getElementById('planDateText').textContent = plan.formatted_date || plan.exam_date;
      document.getElementById('planSessionText').textContent = plan.session;
      document.getElementById('planTotalText').textContent = `${plan.total_students_scheduled} Students`;
      document.getElementById('planRoomsText').textContent = `${plan.rooms_used} Halls`;

      const container = document.getElementById('noticeContainer');
      container.innerHTML = '';

      plan.room_allocations.forEach(r => {
        const roomDiv = document.createElement('div');
        roomDiv.className = 'room-notice';

        // Left column
        let leftColHtml = '<div class="column-half"><div class="col-title left-col-title">Column A (Left Side)</div><p style="color:#94a3b8;">No allocation</p></div>';
        if (r.left) {
          const rollsHtml = r.left.students.map(s => `<span class="roll-tag">${s.roll_no}</span>`).join('');
          leftColHtml = `
            <div class="column-half">
              <div class="col-title left-col-title">
                <span>Column A (Left Side)</span>
                <span>${r.left.count} Students</span>
              </div>
              <div class="detail-row"><label>Class / Year:</label> <strong>${r.left.group}</strong></div>
              <div class="detail-row"><label>Subject Code:</label> <code>${r.left.subject_code}</code></div>
              <div class="detail-row"><label>Subject Name:</label> <strong>${r.left.subject}</strong></div>
              <div class="detail-row"><label>Roll Range:</label> <strong>${r.left.roll_range}</strong></div>
              <div class="roll-grid">
                <div class="roll-tags">${rollsHtml}</div>
              </div>
            </div>
          `;
        }

        // Right column
        let rightColHtml = '<div class="column-half"><div class="col-title right-col-title">Column B (Right Side)</div><p style="color:#94a3b8;">No allocation</p></div>';
        if (r.right) {
          const rollsHtml = r.right.students.map(s => `<span class="roll-tag">${s.roll_no}</span>`).join('');
          rightColHtml = `
            <div class="column-half">
              <div class="col-title right-col-title">
                <span>Column B (Right Side)</span>
                <span>${r.right.count} Students</span>
              </div>
              <div class="detail-row"><label>Class / Year:</label> <strong>${r.right.group}</strong></div>
              <div class="detail-row"><label>Subject Code:</label> <code>${r.right.subject_code}</code></div>
              <div class="detail-row"><label>Subject Name:</label> <strong>${r.right.subject}</strong></div>
              <div class="detail-row"><label>Roll Range:</label> <strong>${r.right.roll_range}</strong></div>
              <div class="roll-grid">
                <div class="roll-tags">${rollsHtml}</div>
              </div>
            </div>
          `;
        }

        roomDiv.innerHTML = `
          <div class="room-notice-header">
            <h2>${r.room_no} — ${r.block}</h2>
            <span>Total Seated: ${r.allocated_count} / ${r.total_capacity}</span>
          </div>
          <div class="columns-container">
            ${leftColHtml}
            ${rightColHtml}
          </div>
        `;
        container.appendChild(roomDiv);
      });
    }
  </script>
</body>
</html>
