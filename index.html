<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | Exam Seating Arrangement System</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
    }

    .card {
      background: #ffffff;
      padding: 50px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 480px;
      width: 90%;
      animation: fadeIn 0.8s ease-in-out;
    }

    h1 {
      color: #333;
      margin-bottom: 12px;
      font-size: 26px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.3;
    }

    p.subtitle {
      color: #666;
      font-size: 15px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .main-btn {
      background: linear-gradient(135deg, #007bff, #0056d2);
      border: none;
      color: white;
      padding: 13px 36px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      text-decoration: none;
      display: inline-block;
      width: 85%;
      box-sizing: border-box;
    }

    .main-btn:hover {
      background: linear-gradient(135deg, #0056d2, #0041a8);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
    }

    .badge-standalone {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 20px;
      border: 1px solid #c8e6c9;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge-standalone">&#10004; Browser Ready (No XAMPP Needed)</div>
    <h1>Exam Seating Arrangement</h1>
    <p class="subtitle">Automated seating plan generator for examination centers and universities.</p>
    
    <div class="btn-group">
      <a href="exam_seating.html" class="main-btn" id="loginBtn">Admin Login</a>
      <a href="admin.html" class="main-btn" style="background: linear-gradient(135deg, #28a745, #218838);">Direct Seating Dashboard</a>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if (isLoggedIn()) {
      document.getElementById('loginBtn').textContent = 'Go to Dashboard';
      document.getElementById('loginBtn').href = 'admin.html';
    }
  </script>
</body>
</html>
